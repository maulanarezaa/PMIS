{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="page-heading">
    <h3>Input Data Karyawan</h3>
</div>

<section class="section">
    <div class="card">
        <form class="form form-vertical" method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <!-- ================= DATA DIRI ================= -->
            <div class="card-header">
                <h4 class="card-title">Data Diri</h4>
            </div>

            <div class="card-body">
                <div class="row">

                    <div class="col-12">
                        <div class="form-group has-icon-left">
                            <label>Nama Lengkap</label>
                            <div class="position-relative">
                                <input type="text" class="form-control" name="Nama" placeholder="Masukkan Nama lengkap">
                                <div class="form-control-icon">
                                    <i class="bi bi-person"></i>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-12">
                        <div class="form-group has-icon-left">
                            <label>Alamat</label>
                            <div class="position-relative">
                                <input type="text" class="form-control" name="Alamat"
                                    placeholder="Masukan Alamat Tempat Tinggal">
                                <div class="form-control-icon">
                                    <i class="bi bi-house"></i>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-6">
                        <div class="form-group has-icon-left">
                            <label>Kontak</label>
                            <div class="position-relative">
                                <input type="text" class="form-control" name="Kontak" placeholder="Masukkan Nomor HP">
                                <div class="form-control-icon">
                                    <i class="bi bi-phone"></i>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-6">
                        <div class="form-group has-icon-left">
                            <label>NIK</label>
                            <div class="position-relative">
                                <input type="text" class="form-control" name="NIK" placeholder="Masukkan NIK">
                                <div class="form-control-icon">
                                    <i class="bi bi-window"></i>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-6">
                        <div class="form-group has-icon-left">
                            <label>NPWP</label>
                            <div class="position-relative">
                                <input type="text" class="form-control" name="NPWP" placeholder="Masukkan NPWP">
                                <div class="form-control-icon">
                                    <i class="bi bi-wallet"></i>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-6">
                        <div class="form-group has-icon-left">
                            <label>No KK</label>
                            <div class="position-relative">
                                <input type="text" class="form-control" name="NOKK" placeholder="Masukkan Nomor KK">
                                <div class="form-control-icon">
                                    <i class="bi bi-upc"></i>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-6">
                        <div class="form-group has-icon-left">
                            <label>Nama Ibu</label>
                            <div class="position-relative">
                                <input type="text" class="form-control" name="NamaIbu" placeholder="Nama Ibu">
                                <div class="form-control-icon">
                                    <i class="bi bi-person-check"></i>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-6">
                        <div class="form-group has-icon-left">
                            <label>Remarks</label>
                            <div class="position-relative">
                                <input type="text" class="form-control" name="Remarks" placeholder="Masukkan Catatan">
                                <div class="form-control-icon">
                                    <i class="bi bi-file-text"></i>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>

            <!-- ================= FOTO ================= -->
            <div class="card-header">
                <h4 class="card-title">Foto</h4>
            </div>

            <div class="card-body">
                <div class="row">

                    <div class="col-md-4">
                        <label>Foto KTP</label>
                        <input class="form-control" type="file" name="FotoKTP" accept="image/jpeg,image/png">
                    </div>

                    <div class="col-md-4">
                        <label>Foto NPWP</label>
                        <input class="form-control" type="file" name="FotoNPWP" accept="image/jpeg,image/png">
                    </div>

                    <div class="col-md-4">
                        <label>Foto KK</label>
                        <input class="form-control" type="file" name="FotoKK" accept="image/jpeg,image/png">
                    </div>

                </div>
            </div>

            <!-- ================= PEKERJAAN ================= -->
            <div class="card-header">
                <h4 class="card-title">Pekerjaan</h4>
            </div>

            <div class="card-body">
                <div class="row">

                    <!-- TOGGLE -->
                    <div class="col-12">
                        <label>Penempatan</label>

                        <div class="mb-2">
                            <div class="btn-group" role="group">
                                <input type="radio" class="btn-check" name="mode_penempatan" id="modeProyek"
                                    value="proyek" checked>
                                <label class="btn btn-outline-primary" for="modeProyek">Proyek</label>

                                <input type="radio" class="btn-check" name="mode_penempatan" id="modeOffice"
                                    value="office">
                                <label class="btn btn-outline-secondary" for="modeOffice">Office</label>
                            </div>
                        </div>
                    </div>

                    <!-- PROYEK / OFFICE -->
                    <div class="col-12">
                        <div class="form-group has-icon-left">

                            <div class="position-relative">

                                <!-- SELECT PROYEK -->
                                <select name="Proyek" required id="selectProyek" class="form-control">
                                    <option value="" disabled selected>Masukkan Nama Proyek</option>
                                    {% for item in proyek %}
                                    <option value="{{item.id}}">
                                        {{item.NomorJO}} - {{item.Deskripsi}}
                                    </option>
                                    {% endfor %}
                                </select>

                                <!-- OFFICE -->
                                <input type="text" id="inputOffice" class="form-control mt-2 d-none" value="Office"
                                    disabled>

                                <div class="form-control-icon">
                                    <i class="bi bi-bar-chart"></i>
                                </div>
                            </div>

                        </div>
                    </div>

                    <!-- KONTRAK -->
                    <div class="col-12">
                        <div class="form-group has-icon-left">
                            <label>Kontrak</label>
                            <div class="input-group">
                                <input type="number" class="form-control" name="JenisKontrak" placeholder="Durasi">
                                <select name="satuan_kontrak" class="form-select">
                                    <option value="Hari">Hari</option>
                                    <option value="Bulan">Bulan</option>
                                    <option value="Tahun">Tahun</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="col-6">
                        <label>Tanggal Mulai</label>
                        <input type="date" class="form-control" name="TanggalAwal">
                    </div>

                    <div class="col-6">
                        <label>Posisi</label>
                        <input type="text" class="form-control" name="Posisi">
                    </div>

                    <div class="col-6">
                        <label>Keterangan</label>
                        <input type="text" class="form-control" name="RemarksKontrak">
                    </div>

                    <div class="col-6">
                        <label>Status</label>
                        <select name="StatusAktif" class="form-control">
                            <option value="True">Aktif</option>
                            <option value="False">Non-Aktif</option>
                        </select>
                    </div>

                </div>

                <div class="col-12 d-flex justify-content-end mt-3">
                    <button type="submit" class="btn btn-primary me-2">Submit</button>
                    <button type="reset" class="btn btn-light-secondary">Reset</button>
                </div>
            </div>

        </form>
    </div>
</section>

<!-- ================= JS ================= -->
<script>
    document.addEventListener("DOMContentLoaded", function () {

        const modeProyek = document.getElementById("modeProyek");
        const modeOffice = document.getElementById("modeOffice");
        const selectProyek = document.getElementById("selectProyek");
        const inputOffice = document.getElementById("inputOffice");

        function toggleMode() {
            if (modeProyek.checked) {
                selectProyek.disabled = false;
                selectProyek.classList.remove("d-none");

                inputOffice.classList.add("d-none");
            } else {
                selectProyek.disabled = true;
                selectProyek.classList.add("d-none");

                inputOffice.classList.remove("d-none");
            }
        }

        modeProyek.addEventListener("change", toggleMode);
        modeOffice.addEventListener("change", toggleMode);

        toggleMode();
    });
</script>

{% endblock content %}
