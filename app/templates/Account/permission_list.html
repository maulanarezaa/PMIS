{% extends 'base.html' %}

{% block content %}
<div class="page-heading">
    <h3>Permission Management</h3>
    <a href="{% url 'permission_create' %}" class="btn btn-primary">+ Tambah</a>
</div>

<div class="card mt-3">
    <div class="card-body">
        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>Nama</th>
                    <th>Kode</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody>
                {% for p in permissions %}
                <tr>
                    <td>{{ p.nama }}</td>
                    <td>{{ p.kode }}</td>
                    <td>
                        <a href="{% url 'permission_edit' p.id %}" class="btn btn-warning btn-sm">Edit</a>
                        <a href="{% url 'permission_delete' p.id %}" class="btn btn-danger btn-sm">Hapus</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
