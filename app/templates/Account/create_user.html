{% extends 'base.html' %}

{% block content %}
<div class="page-heading">
    <h3>Buat Akun - {{ karyawan.nama }}</h3>
</div>

<div class="card">
    <div class="card-body">
        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" class="form-control" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>

            <hr>

            <div class="form-group">
                <label>Role</label>
                {% for role in roles %}
                <div>
                    <input type="checkbox" name="roles" value="{{ role.id }}"> {{ role.nama }}
                </div>
                {% endfor %}
            </div>

            <hr>

            <div class="form-group">
                <label>Project Access</label>
                {% for project in projects %}
                <div>
                    <input type="checkbox" name="projects" value="{{ project.id }}"> {{ project.nama }}
                </div>
                {% endfor %}
            </div>

            <button class="btn btn-primary mt-3">Create User</button>
        </form>
    </div>
</div>
{% endblock %}
