{% extends 'base.html' %}

{% block content %}
<div class="page-heading">
    <h3>Form Role</h3>
</div>

<div class="card">
    <div class="card-body">
        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label>Nama Role</label>
                {{ form.nama }}
            </div>

            <hr>

            <label>Permissions</label>
            {% for p in permissions %}
            <div>
                <input type="checkbox" name="permissions" value="{{ p.id }}"
                {% if p.id in selected_permissions %}checked{% endif %}>
                {{ p.nama }}
            </div>
            {% endfor %}

            <button class="btn btn-success mt-3">Simpan</button>
        </form>
    </div>
</div>
{% endblock %}
