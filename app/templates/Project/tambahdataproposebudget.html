{% extends 'base.html' %}
{% load static %}

{% block content %}
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<div class="page-heading">
    <h3>Input Propose Budget</h3>
</div>

<section class="section">
<div class="card">
<form method="POST" enctype="multipart/form-data">
{% csrf_token %}

<div class="card-header">
    <h4 class="card-title">Data Propose Budget</h4>
</div>

<div class="card-body">
<div class="row">

    <div class="col-md-4">
        <label>Tanggal</label>
        <input type="date" class="form-control" name="tanggal" required>
    </div>

    <div class="col-md-4">
        <label>No Propose Budget</label>
        <input type="text" class="form-control" name="nomorproposebudget" required>
    </div>

    <div class="col-md-4">
        <label>No Job Order</label>
        <select class="form-control" name="joborder">
            <option value="" disabled selected>Pilih JO</option>
            {% for item in datajo %}
            <option value="{{item.id}}">{{item.NomorJO}} - {{item.Deskripsi}}</option>
            {% endfor %}
        </select>
    </div>

    <div class="col-md-6 mt-2">
        <label>Catatan</label>
        <input type="text" class="form-control" name="remarks">
    </div>

    <div class="col-md-3 mt-2">
        <label>Upload File</label>
        <input class="form-control" type="file" name="fileproposebudget">
    </div>

    <!-- GRAND TOTAL -->
    <div class="col-md-3 mt-2">
        <label>Total Budget</label>
        <input type="text" id="grand-total" class="form-control" disabled>
    </div>

</div>

<h4 class="card-title mt-3">Item Proposed Budget</h4>

<table class="table table-bordered" id="table-input">
<thead>
<tr>
    <th>Nama Item</th>
    <th>Jumlah</th>
    <th>Satuan</th>
    <th>Harga</th>
    <th>Total Harga</th>
    <th>Catatan</th>
    <th>Aksi</th>
</tr>
</thead>

<tbody id="table-body">

<tr>
    <td>
        <input type="text" class="form-control item-search" name="item">
    </td>

    <td>
        <input type="number" name="jumlah" class="form-control jumlah">
    </td>

    <td>
        <input type="text" name="satuan" class="form-control">
    </td>

    <td>
        <input type="number" name="harga" class="form-control harga">
    </td>

    <td>
        <input type="number" name="total_harga" class="form-control total-harga" readonly>
    </td>

    <td>
        <input type="text" name="catatan" class="form-control">
    </td>

    <td>
        <button type="button" class="btn btn-danger btn-sm remove-row">X</button>
    </td>
</tr>

</tbody>
</table>

</div>

<button type="button" class="btn btn-secondary" id="add-row">+ Tambah Baris</button>
<button type="submit" class="btn btn-primary">Simpan Semua</button>

</form>
</div>
</section>

<!-- ================= JS ================= -->
<script>

// ================= ADD ROW =================
$("#add-row").click(function () {
    let row = $("#table-body tr:first").clone();
    row.find("input").val("");
    $("#table-body").append(row);
});

// ================= REMOVE ROW =================
$(document).on("click", ".remove-row", function () {
    if ($("#table-body tr").length > 1) {
        $(this).closest("tr").remove();
        hitungGrandTotal();
    }
});

// ================= HITUNG PER ROW =================
function hitungTotalRow(row) {
    let jumlah = parseFloat(row.find('.jumlah').val()) || 0;
    let harga = parseFloat(row.find('.harga').val()) || 0;
    let total = jumlah * harga;

    row.find('.total-harga').val(total);
}

// ================= HITUNG GRAND TOTAL =================
function hitungGrandTotal() {
    let total = 0;

    $('#table-body tr').each(function () {
        let val = parseFloat($(this).find('.total-harga').val()) || 0;
        total += val;
    });

    $('#grand-total').val("Rp " + total.toLocaleString('id-ID'));
}

// ================= TRIGGER =================
$(document).on('keyup change', '.jumlah, .harga', function () {
    let row = $(this).closest('tr');
    hitungTotalRow(row);
    hitungGrandTotal();
});

// ================= LOAD AWAL =================
$(document).ready(function () {
    $('#table-body tr').each(function () {
        hitungTotalRow($(this));
    });
    hitungGrandTotal();
});

</script>

{% endblock %}
